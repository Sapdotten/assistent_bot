[project]
name = "assistent bot"
version = "0.1.0"
description = "Repository for assistant bot project, that turns everyday routine to daily tasks and quests"
authors = [
    {name = "sapdotten"}
]
license = {text = "MIT License"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.10"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.poe.tasks.pytest]
shell = "pytest -m 'not (e2e or infrastructure or integration)'"

[tool.poe.tasks.mypy]
shell = "mypy --explicit-package-bases --config-file .mypy.ini"

[tool.poe.tasks.ruff]
shell = "ruff check --no-cache --output-format grouped --config .ruff.toml ."

[tool.poe.tasks.ruff-fix]
shell = "ruff check --no-cache --output-format grouped --fix --show-fixes --config .ruff.toml ."